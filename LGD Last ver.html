<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucasta Grid Drawer</title>
  <style>
    :root {
      --bg: #0b0b10;
      --panel: #12121a;
      --panel2: #1a1a24;
      --border: #2a2a38;
      --border2: #36364a;
      --accent: #4f8cff;
      --accent-glow: rgba(79,140,255,0.28);
      --text: #e8e8f2;
      --muted: #7a7a92;
      --danger: #ff5c6c;
      --success: #2ed573;
      --glow: 0 0 12px rgba(79,140,255,0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      user-select: none; font-size: 13px;
    }
    .topbar {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 12px; background: var(--panel);
      border-bottom: 1px solid var(--border); flex-shrink: 0; height: 44px;
    }
    .logo {
      font-weight: 700; font-size: 14px; color: var(--accent);
      margin-right: 8px; display: flex; align-items: center; gap: 6px;
    }
    .logo-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 10px var(--accent), 0 0 20px rgba(79,140,255,0.4);
    }
    .btn {
      background: var(--panel2); border: 1px solid var(--border); color: var(--text);
      padding: 5px 11px; border-radius: 6px; cursor: pointer; font-size: 12px;
      font-weight: 500; transition: all 0.12s; display: inline-flex;
      align-items: center; gap: 5px; height: 30px;
    }
    .btn:hover { background: #222230; border-color: var(--border2); }
    .btn:active { transform: scale(0.97); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 12px rgba(79,140,255,0.35); }
    .btn.primary:hover { filter: brightness(1.1); box-shadow: 0 0 18px rgba(79,140,255,0.5); }
    .btn.icon { padding: 5px 9px; min-width: 30px; justify-content: center; }
    .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
    .zoom-box {
      display: flex; align-items: center; gap: 4px;
      background: var(--panel2); border: 1px solid var(--border);
      border-radius: 6px; padding: 0 4px; height: 30px;
    }
    .zoom-label { font-size: 11px; color: var(--muted); min-width: 38px; text-align: center; }
    .main { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 196px; background: var(--panel); border-right: 1px solid var(--border);
      padding: 10px 8px; display: flex; flex-direction: column; gap: 12px;
      overflow-y: auto; flex-shrink: 0;
    }
    .sec-title {
      font-size: 9.5px; text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--muted); margin-bottom: 5px; font-weight: 600;
    }
    .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .tool {
      background: var(--panel2); border: 1px solid var(--border); border-radius: 7px;
      padding: 9px 4px; cursor: pointer; text-align: center; font-size: 11px;
      color: var(--text); transition: all 0.12s; display: flex; flex-direction: column;
      align-items: center; gap: 3px;
    }
    .tool:hover { border-color: var(--border2); background: #1f1f2c; }
    .tool.active {
      border-color: var(--accent); background: var(--accent-glow);
      color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), 0 0 14px rgba(79,140,255,0.25);
    }
    .tool .ic { font-size: 16px; line-height: 1; opacity: 0.9; }
    .row { display: flex; gap: 6px; align-items: center; margin-bottom: 7px; }
    .row label { font-size: 11px; color: var(--muted); min-width: 46px; }
    input[type="color"] {
      -webkit-appearance: none; width: 32px; height: 26px;
      border: 1px solid var(--border); border-radius: 5px;
      background: transparent; cursor: pointer; padding: 1px;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }
    input[type="number"], input[type="text"] {
      background: var(--panel2); border: 1px solid var(--border); color: var(--text);
      padding: 5px 7px; border-radius: 5px; font-size: 12px; width: 100%; outline: none;
    }
    input[type="number"]:focus, input[type="text"]:focus { border-color: var(--accent); }
    input[type="checkbox"] { accent-color: var(--accent); width: 13px; height: 13px; cursor: pointer; }
    .chk { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); margin: 5px 0; cursor: pointer; }
    .stage { flex: 1; position: relative; overflow: hidden; background: #08080c; }
    #svg { width: 100%; height: 100%; display: block; cursor: crosshair; }
    .hud {
      position: absolute; bottom: 10px; left: 10px;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(6px);
      padding: 4px 10px; border-radius: 6px;
      font-size: 11px; font-family: ui-monospace, monospace; color: var(--muted);
      pointer-events: none; border: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-r {
      width: 210px; background: var(--panel); border-left: 1px solid var(--border);
      padding: 10px 8px; display: flex; flex-direction: column; gap: 11px;
      overflow-y: auto; flex-shrink: 0;
    }
    .field { margin-bottom: 6px; }
    .field > label {
      display: block; font-size: 9.5px; color: var(--muted);
      margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.6px;
    }
    .field-row { display: flex; gap: 5px; }
    .field-row .field { flex: 1; }
    .obj-list {
      flex: 1; overflow-y: auto; background: var(--panel2);
      border: 1px solid var(--border); border-radius: 6px; padding: 3px; min-height: 100px;
    }
    .obj-item {
      padding: 5px 7px; border-radius: 5px; cursor: pointer; font-size: 11.5px;
      display: flex; align-items: center; gap: 6px; color: var(--muted);
    }
    .obj-item:hover { background: #222230; }
    .obj-item.selected { background: var(--accent-glow); color: var(--accent); }
    .obj-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .btn-row { display: flex; gap: 5px; }
    .btn-row .btn { flex: 1; justify-content: center; font-size: 11.5px; height: 28px; }
    .sel-box { fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-dasharray: 5 3; pointer-events: none; filter: drop-shadow(0 0 3px rgba(79,140,255,0.6)); }
    .handle { fill: var(--accent); stroke: #fff; stroke-width: 1.2; cursor: nwse-resize; filter: drop-shadow(0 0 4px rgba(79,140,255,0.7)); }
    .rot-handle { fill: #2ed573; stroke: #fff; stroke-width: 1.2; cursor: grab; filter: drop-shadow(0 0 4px rgba(46,213,115,0.6)); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo"><div class="logo-dot"></div> Lucasta Grid Drawer</div>
    <button class="btn" id="btnNew">Nuevo</button>
    <button class="btn" id="btnOpen">Abrir .lgd</button>
    <button class="btn primary" id="btnSave">Guardar .lgd</button>
    <div class="sep"></div>
    <button class="btn icon" id="btnUndo" title="Ctrl+Z">↶</button>
    <button class="btn icon" id="btnRedo" title="Ctrl+Y">↷</button>
    <div class="sep"></div>
    <div class="zoom-box">
      <button class="btn icon" id="btnZoomOut" style="border:none;background:transparent;height:24px">−</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button class="btn icon" id="btnZoomIn" style="border:none;background:transparent;height:24px">+</button>
    </div>
    <button class="btn" id="btnFit">Ajustar</button>
    <div style="flex:1"></div>
    <button class="btn" id="btnExport">Exportar PNG</button>
  </div>

  <div class="main">
    <div class="sidebar">
      <div>
        <div class="sec-title">Herramientas</div>
        <div class="tool-grid">
          <button class="tool active" data-tool="select"><span class="ic">⬚</span>Seleccionar</button>
          <button class="tool" data-tool="pencil"><span class="ic">✎</span>Lápiz</button>
          <button class="tool" data-tool="line"><span class="ic">╱</span>Línea</button>
          <button class="tool" data-tool="bezier"><span class="ic">∿</span>Bézier</button>
          <button class="tool" data-tool="rect"><span class="ic">□</span>Cuadro</button>
          <button class="tool" data-tool="triangle"><span class="ic">△</span>Triángulo</button>
          <button class="tool" data-tool="circle"><span class="ic">○</span>Círculo</button>
          <button class="tool" data-tool="pixel"><span class="ic">▦</span>Píxel</button>
          <button class="tool" data-tool="eraser"><span class="ic">⌫</span>Borrador</button>
          <button class="tool" data-tool="pan"><span class="ic">✋</span>Mover vista</button>
        </div>
      </div>
      <div>
        <div class="sec-title">Estilo</div>
        <div class="row">
          <label>Color</label>
          <input type="color" id="strokeColor" value="#4f8cff" />
          <label style="min-width:auto;margin-left:2px">Relleno</label>
          <input type="color" id="fillColor" value="#4f8cff" />
        </div>
        <label class="chk"><input type="checkbox" id="fillShapes" /> Rellenar figuras</label>
        <div class="row">
          <label>Grosor</label>
          <input type="number" id="strokeWidth" value="2.5" min="0.5" max="24" step="0.5" style="width:58px" />
        </div>
        <div class="row">
          <label>Grid</label>
          <input type="number" id="gridSize" value="32" min="8" max="128" step="8" style="width:58px" />
        </div>
        <div style="margin-top:8px">
          <div class="sec-title" style="margin-bottom:6px">Lápiz / Path</div>
          <div class="tool-grid" style="grid-template-columns:1fr 1fr">
            <button class="tool active" id="modeLegacy" type="button" style="padding:7px 4px;font-size:10.5px">
              <span class="ic">━</span>Legacy
            </button>
            <button class="tool" id="modeSmooth" type="button" style="padding:7px 4px;font-size:10.5px">
              <span class="ic">∿</span>Smooth
            </button>
          </div>
          <div style="font-size:10px;color:var(--muted);margin-top:5px;line-height:1.35">
            Legacy = rectas firmes · Smooth = cúbicas suaves
          </div>
        </div>
      </div>
      <div>
        <div class="sec-title">Vista</div>
        <label class="chk"><input type="checkbox" id="showGrid" checked /> Mostrar cuadrícula</label>
        <label class="chk"><input type="checkbox" id="snapGrid" checked /> Snap a grid</label>
      </div>
    </div>

    <div class="stage" id="stage">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="gridPat" width="32" height="32" patternUnits="userSpaceOnUse">
            <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#16161f" stroke-width="1"/>
          </pattern>
          <filter id="strokeGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <g id="world">
          <rect id="gridBg" x="-8000" y="-8000" width="16000" height="16000" fill="url(#gridPat)" />
          <g id="objects"></g>
          <g id="preview"></g>
          <g id="selection"></g>
        </g>
      </svg>
      <div class="hud" id="hud">0 objetos · x 0 · y 0 · 100%</div>
    </div>

    <div class="sidebar-r">
      <div>
        <div class="sec-title">Archivo</div>
        <div class="field">
          <label>Nombre</label>
          <input type="text" id="projectName" value="mi_dibujo" />
        </div>
        <div class="btn-row">
          <button class="btn" id="btnClear">Limpiar</button>
        </div>
      </div>
      <div>
        <div class="sec-title">Selección</div>
        <div class="field-row">
          <div class="field"><label>X</label><input type="number" id="selX" value="0" step="1" /></div>
          <div class="field"><label>Y</label><input type="number" id="selY" value="0" step="1" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Ancho</label><input type="number" id="selW" value="0" step="1" /></div>
          <div class="field"><label>Alto</label><input type="number" id="selH" value="0" step="1" /></div>
        </div>
        <div class="field">
          <label>Rotación °</label>
          <input type="number" id="selRot" value="0" step="15" />
        </div>
        <div class="btn-row" style="margin-top:4px">
          <button class="btn" id="btnApply">Aplicar</button>
          <button class="btn" id="btnDuplicate">Duplicar</button>
        </div>
        <div class="btn-row" style="margin-top:4px">
          <button class="btn" id="btnDeleteSel" style="color:var(--danger)">Eliminar</button>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;min-height:0">
        <div class="sec-title">Objetos <span id="objCount" style="color:var(--muted)">(0)</span></div>
        <div class="obj-list" id="objList"></div>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept=".lgd,.json" style="display:none" />

  <script>
  const svg = document.getElementById('svg');
  const world = document.getElementById('world');
  const objectsG = document.getElementById('objects');
  const previewG = document.getElementById('preview');
  const selectionG = document.getElementById('selection');
  const gridBg = document.getElementById('gridBg');
  const gridPat = document.getElementById('gridPat');

  const state = {
    tool: 'select', objects: [], selectedId: null,
    camera: { x: 0, y: 0, zoom: 1 },
    gridSize: 32, showGrid: true, snap: true,
    strokeColor: '#4f8cff', fillColor: '#4f8cff', fillShapes: false, strokeWidth: 2.5,
    pencilMode: 'legacy', // 'legacy' | 'smooth'
    isDrawing: false, isPanning: false, isDragging: false, isResizing: false, isRotating: false,
    resizeHandle: null, startPos: null, currentPath: null, bezierPts: [],
    history: [], historyIndex: -1,
    mouse: { sx: 0, sy: 0, wx: 0, wy: 0 },
    dragOffset: { x: 0, y: 0 }, lastPan: { x: 0, y: 0 },
    rotStartAngle: 0, rotCenter: null
  };

  let idCounter = 1;
  function uid() { return 'o' + (idCounter++); }

  function screenToWorld(sx, sy) {
    return { x: sx / state.camera.zoom + state.camera.x, y: sy / state.camera.zoom + state.camera.y };
  }
  function getMouse(e) {
    const rect = svg.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const w = screenToWorld(sx, sy);
    return { sx, sy, wx: w.x, wy: w.y };
  }
  function snap(v) { return state.snap ? Math.round(v / state.gridSize) * state.gridSize : v; }

  function applyCamera() {
    const { x, y, zoom } = state.camera;
    world.setAttribute('transform', `scale(${zoom}) translate(${-x}, ${-y})`);
    document.getElementById('zoomLabel').textContent = Math.round(zoom * 100) + '%';
    updateHud();
  }

  function pushHistory() {
    const s = JSON.stringify(state.objects);
    state.history = state.history.slice(0, state.historyIndex + 1);
    state.history.push(s);
    if (state.history.length > 50) state.history.shift();
    state.historyIndex = state.history.length - 1;
  }
  function undo() {
    if (state.historyIndex <= 0) return;
    state.historyIndex--;
    state.objects = JSON.parse(state.history[state.historyIndex]);
    state.selectedId = null; rebuildSVG(); updateUI();
  }
  function redo() {
    if (state.historyIndex >= state.history.length - 1) return;
    state.historyIndex++;
    state.objects = JSON.parse(state.history[state.historyIndex]);
    state.selectedId = null; rebuildSVG(); updateUI();
  }

  function getSelected() { return state.objects.find(o => o.id === state.selectedId) || null; }

  function getBounds(obj) {
    if (obj.type === 'line') {
      return { x: Math.min(obj.x1, obj.x2), y: Math.min(obj.y1, obj.y2),
               w: Math.abs(obj.x2 - obj.x1) || 1, h: Math.abs(obj.y2 - obj.y1) || 1 };
    }
    if (obj.type === 'path' || obj.type === 'bezier') {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      obj.points.forEach(p => {
        minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
        maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
      });
      return { x: minX, y: minY, w: maxX - minX || 1, h: maxY - minY || 1 };
    }
    return { x: obj.x, y: obj.y, w: obj.w, h: obj.h };
  }
  function getCenter(obj) {
    const b = getBounds(obj);
    return { x: b.x + b.w / 2, y: b.y + b.h / 2 };
  }

  function hitTest(wx, wy) {
    for (let i = state.objects.length - 1; i >= 0; i--) {
      const o = state.objects[i];
      const b = getBounds(o);
      const pad = 8 / state.camera.zoom;
      if (wx >= b.x - pad && wx <= b.x + b.w + pad && wy >= b.y - pad && wy <= b.y + b.h + pad)
        return o;
    }
    return null;
  }

  function createSVGElement(obj) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.dataset.id = obj.id;
    const rot = obj.rot || 0;
    const c = getCenter(obj);
    if (rot) g.setAttribute('transform', `rotate(${rot}, ${c.x}, ${c.y})`);

    const stroke = obj.stroke || state.strokeColor;
    const fill = obj.filled ? (obj.fill || state.fillColor) : 'none';
    const sw = obj.thickness || state.strokeWidth;
    let el;

    if (obj.type === 'line') {
      el = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      el.setAttribute('x1', obj.x1); el.setAttribute('y1', obj.y1);
      el.setAttribute('x2', obj.x2); el.setAttribute('y2', obj.y2);
      el.setAttribute('stroke', stroke); el.setAttribute('stroke-width', sw);
      el.setAttribute('stroke-linecap', 'round');
      el.setAttribute('filter', 'url(#strokeGlow)');
    } else if (obj.type === 'rect') {
      el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      el.setAttribute('x', obj.x); el.setAttribute('y', obj.y);
      el.setAttribute('width', obj.w); el.setAttribute('height', obj.h);
      el.setAttribute('stroke', stroke); el.setAttribute('stroke-width', sw);
      el.setAttribute('fill', fill); el.setAttribute('rx', 1);
      el.setAttribute('filter', 'url(#strokeGlow)');
    } else if (obj.type === 'triangle') {
      el = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      el.setAttribute('points', `${obj.x+obj.w/2},${obj.y} ${obj.x+obj.w},${obj.y+obj.h} ${obj.x},${obj.y+obj.h}`);
      el.setAttribute('stroke', stroke); el.setAttribute('stroke-width', sw);
      el.setAttribute('fill', fill); el.setAttribute('stroke-linejoin', 'round');
      el.setAttribute('filter', 'url(#strokeGlow)');
    } else if (obj.type === 'circle') {
      el = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      el.setAttribute('cx', obj.x + obj.w / 2);
      el.setAttribute('cy', obj.y + obj.h / 2);
      el.setAttribute('rx', Math.abs(obj.w) / 2);
      el.setAttribute('ry', Math.abs(obj.h) / 2);
      el.setAttribute('stroke', stroke);
      el.setAttribute('stroke-width', sw);
      el.setAttribute('fill', fill);
      el.setAttribute('filter', 'url(#strokeGlow)');
    } else if (obj.type === 'pixel') {
      el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      el.setAttribute('x', obj.x); el.setAttribute('y', obj.y);
      el.setAttribute('width', obj.w); el.setAttribute('height', obj.h);
      el.setAttribute('fill', stroke); el.setAttribute('stroke', 'none');
    } else if (obj.type === 'path' || obj.type === 'bezier') {
      el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      // Legacy = polyline firme | Smooth/Bezier = cúbicas
      const useSmooth = obj.type === 'bezier' || obj.smooth === true;
      el.setAttribute('d', useSmooth ? pointsToCubicPath(obj.points) : pointsToLinearPath(obj.points));
      el.setAttribute('stroke', stroke);
      el.setAttribute('stroke-width', sw);
      el.setAttribute('fill', 'none');
      el.setAttribute('stroke-linecap', 'round');
      el.setAttribute('stroke-linejoin', 'round');
      el.setAttribute('filter', 'url(#strokeGlow)');
    }

    if (el) {
      el.style.pointerEvents = 'stroke';
      if (obj.type !== 'pixel') el.setAttribute('filter', 'url(#strokeGlow)');
      g.appendChild(el);
    }
    return g;
  }

  // Legacy: polyline recta y firme
  function pointsToLinearPath(pts) {
    if (!pts || pts.length < 2) return '';
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < pts.length; i++) d += ` L ${pts[i].x} ${pts[i].y}`;
    return d;
  }

  // Smooth: cubic Bezier (Catmull-Rom → cubic)
  function pointsToCubicPath(pts) {
    if (!pts || pts.length < 2) return '';
    if (pts.length === 2) {
      return `M ${pts[0].x} ${pts[0].y} L ${pts[1].x} ${pts[1].y}`;
    }
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[Math.min(pts.length - 1, i + 2)];
      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
    }
    return d;
  }

  // Chaikin-ish / simple moving average smooth for freehand
  function smoothPoints(pts, passes) {
    if (!pts || pts.length < 3) return pts;
    let result = pts.slice();
    for (let p = 0; p < (passes || 2); p++) {
      const next = [result[0]];
      for (let i = 0; i < result.length - 1; i++) {
        const a = result[i], b = result[i + 1];
        next.push({ x: a.x * 0.75 + b.x * 0.25, y: a.y * 0.75 + b.y * 0.25 });
        next.push({ x: a.x * 0.25 + b.x * 0.75, y: a.y * 0.25 + b.y * 0.75 });
      }
      next.push(result[result.length - 1]);
      result = next;
    }
    return result;
  }

  function rebuildSVG() {
    objectsG.innerHTML = '';
    state.objects.forEach(obj => objectsG.appendChild(createSVGElement(obj)));
    drawSelection();
    updateHud();
  }

  function drawSelection() {
    selectionG.innerHTML = '';
    const obj = getSelected();
    if (!obj) return;
    const b = getBounds(obj);
    const c = getCenter(obj);
    const rot = obj.rot || 0;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    if (rot) g.setAttribute('transform', `rotate(${rot}, ${c.x}, ${c.y})`);

    const box = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    box.setAttribute('x', b.x - 2); box.setAttribute('y', b.y - 2);
    box.setAttribute('width', b.w + 4); box.setAttribute('height', b.h + 4);
    box.setAttribute('class', 'sel-box');
    g.appendChild(box);

    const hs = 7 / state.camera.zoom;
    [{name:'nw',x:b.x,y:b.y},{name:'ne',x:b.x+b.w,y:b.y},{name:'sw',x:b.x,y:b.y+b.h},{name:'se',x:b.x+b.w,y:b.y+b.h}]
    .forEach(h => {
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', h.x - hs/2); r.setAttribute('y', h.y - hs/2);
      r.setAttribute('width', hs); r.setAttribute('height', hs);
      r.setAttribute('class', 'handle'); r.dataset.handle = h.name;
      g.appendChild(r);
    });

    const rotY = b.y - 22 / state.camera.zoom;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', c.x); line.setAttribute('y1', b.y);
    line.setAttribute('x2', c.x); line.setAttribute('y2', rotY);
    line.setAttribute('stroke', '#2ed573'); line.setAttribute('stroke-width', 1.2 / state.camera.zoom);
    g.appendChild(line);

    const rc = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    rc.setAttribute('cx', c.x); rc.setAttribute('cy', rotY);
    rc.setAttribute('r', 5 / state.camera.zoom);
    rc.setAttribute('class', 'rot-handle'); rc.dataset.handle = 'rotate';
    g.appendChild(rc);

    selectionG.appendChild(g);
  }

  function updateHud() {
    document.getElementById('hud').textContent =
      state.objects.length + ' objetos · x ' + Math.round(state.mouse.wx) + ' · y ' + Math.round(state.mouse.wy) + ' · ' + Math.round(state.camera.zoom * 100) + '%';
  }

  function updateGrid() {
    gridPat.setAttribute('width', state.gridSize);
    gridPat.setAttribute('height', state.gridSize);
    gridPat.querySelector('path').setAttribute('d', `M ${state.gridSize} 0 L 0 0 0 ${state.gridSize}`);
    gridBg.style.display = state.showGrid ? 'block' : 'none';
  }

  function moveObjectTo(obj, nx, ny) {
    if (obj.type === 'line') {
      const dx = nx - Math.min(obj.x1, obj.x2);
      const dy = ny - Math.min(obj.y1, obj.y2);
      obj.x1 += dx; obj.x2 += dx; obj.y1 += dy; obj.y2 += dy;
    } else if (obj.type === 'path' || obj.type === 'bezier') {
      const b = getBounds(obj);
      const dx = nx - b.x, dy = ny - b.y;
      obj.points.forEach(p => { p.x += dx; p.y += dy; });
    } else {
      obj.x = nx; obj.y = ny;
    }
  }

  // ---- Events ----
  svg.addEventListener('mousedown', e => {
    const m = getMouse(e);
    state.mouse = m;

    if (e.button === 1 || state.tool === 'pan') {
      state.isPanning = true;
      state.lastPan = { x: e.clientX, y: e.clientY };
      svg.style.cursor = 'grabbing';
      return;
    }
    if (e.button === 2) {
      const hit = hitTest(m.wx, m.wy);
      if (hit) {
        pushHistory();
        state.objects = state.objects.filter(o => o.id !== hit.id);
        if (state.selectedId === hit.id) state.selectedId = null;
        rebuildSVG(); updateUI();
      }
      return;
    }
    if (e.button !== 0) return;

    if (state.tool === 'select') {
      const obj = getSelected();
      if (obj) {
        const t = e.target;
        if (t.dataset && t.dataset.handle === 'rotate') {
          state.isRotating = true;
          state.rotCenter = getCenter(obj);
          state.rotStartAngle = Math.atan2(m.wy - state.rotCenter.y, m.wx - state.rotCenter.x) * 180 / Math.PI - (obj.rot || 0);
          pushHistory();
          return;
        }
        if (t.dataset && t.dataset.handle) {
          state.isResizing = true;
          state.resizeHandle = t.dataset.handle;
          state.startPos = { bounds: { ...getBounds(obj) } };
          pushHistory();
          return;
        }
      }
      const hit = hitTest(m.wx, m.wy);
      if (hit) {
        state.selectedId = hit.id;
        state.isDragging = true;
        const b = getBounds(hit);
        state.dragOffset = { x: m.wx - b.x, y: m.wy - b.y };
        pushHistory();
      } else state.selectedId = null;
      drawSelection(); updateUI();
      return;
    }

    if (['line','rect','triangle','circle','pixel','pencil','bezier'].includes(state.tool)) {
      let x = snap(m.wx), y = snap(m.wy);
      if (state.tool === 'bezier') {
        state.bezierPts.push({ x, y });
        state.isDrawing = true;
        if (state.bezierPts.length >= 4) finishBezier();
        renderPreview();
        return;
      }
      state.isDrawing = true;
      state.startPos = { x, y };
      if (state.tool === 'pencil') {
        state.currentPath = { id: uid(), type: 'path', points: [{ x, y }], stroke: state.strokeColor, thickness: state.strokeWidth, rot: 0 };
      }
      if (state.tool === 'pixel') {
        pushHistory();
        state.objects.push({ id: uid(), type: 'pixel', x: snap(m.wx), y: snap(m.wy), w: state.gridSize, h: state.gridSize, stroke: state.strokeColor, filled: true, rot: 0 });
        state.isDrawing = false;
        rebuildSVG(); updateUI();
      }
      return;
    }

    if (state.tool === 'eraser') {
      const hit = hitTest(m.wx, m.wy);
      if (hit) {
        pushHistory();
        state.objects = state.objects.filter(o => o.id !== hit.id);
        if (state.selectedId === hit.id) state.selectedId = null;
        rebuildSVG(); updateUI();
      }
    }
  });

  function finishBezier() {
    if (state.bezierPts.length < 2) { state.bezierPts = []; state.isDrawing = false; previewG.innerHTML = ''; return; }
    pushHistory();
    state.objects.push({ id: uid(), type: 'bezier', points: state.bezierPts.slice(), stroke: state.strokeColor, thickness: state.strokeWidth, rot: 0, smooth: true });
    state.bezierPts = [];
    state.isDrawing = false;
    previewG.innerHTML = '';
    rebuildSVG(); updateUI();
  }

  function renderPreview() {
    previewG.innerHTML = '';
    const m = state.mouse;
    const stroke = state.strokeColor, sw = state.strokeWidth;

    if (state.tool === 'bezier' && state.bezierPts.length) {
      const pts = [...state.bezierPts, { x: snap(m.wx), y: snap(m.wy) }];
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      let d = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 1; i < pts.length; i++) d += ` L ${pts[i].x} ${pts[i].y}`;
      path.setAttribute('d', d); path.setAttribute('stroke', stroke); path.setAttribute('stroke-width', sw);
      path.setAttribute('fill', 'none'); path.setAttribute('stroke-dasharray', '6 4'); path.setAttribute('opacity', '0.7');
      previewG.appendChild(path);
      pts.forEach(p => {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 3.5 / state.camera.zoom); c.setAttribute('fill', '#2ed573');
        previewG.appendChild(c);
      });
      return;
    }

    if (!state.startPos) return;
    const x1 = state.startPos.x, y1 = state.startPos.y;
    const x2 = snap(m.wx), y2 = snap(m.wy);

    if (state.tool === 'line') {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1); line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('stroke', stroke); line.setAttribute('stroke-width', sw); line.setAttribute('opacity', '0.7');
      previewG.appendChild(line);
    } else if (state.tool === 'rect') {
      const x = Math.min(x1,x2), y = Math.min(y1,y2), w = Math.abs(x2-x1), h = Math.abs(y2-y1);
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', w); r.setAttribute('height', h);
      r.setAttribute('stroke', stroke); r.setAttribute('stroke-width', sw);
      r.setAttribute('fill', state.fillShapes ? state.fillColor : 'none'); r.setAttribute('opacity', '0.7');
      previewG.appendChild(r);
    } else if (state.tool === 'triangle') {
      const x = Math.min(x1,x2), y = Math.min(y1,y2), w = Math.abs(x2-x1), h = Math.abs(y2-y1);
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      poly.setAttribute('points', `${x+w/2},${y} ${x+w},${y+h} ${x},${y+h}`);
      poly.setAttribute('stroke', stroke); poly.setAttribute('stroke-width', sw);
      poly.setAttribute('fill', state.fillShapes ? state.fillColor : 'none'); poly.setAttribute('opacity', '0.7');
      previewG.appendChild(poly);
    } else if (state.tool === 'circle') {
      const x = Math.min(x1,x2), y = Math.min(y1,y2), w = Math.abs(x2-x1), h = Math.abs(y2-y1);
      const ell = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      ell.setAttribute('cx', x + w/2); ell.setAttribute('cy', y + h/2);
      ell.setAttribute('rx', w/2); ell.setAttribute('ry', h/2);
      ell.setAttribute('stroke', stroke); ell.setAttribute('stroke-width', sw);
      ell.setAttribute('fill', state.fillShapes ? state.fillColor : 'none'); ell.setAttribute('opacity', '0.7');
      previewG.appendChild(ell);
    } else if (state.tool === 'pencil' && state.currentPath) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      let d = '';
      state.currentPath.points.forEach((p, i) => { d += (i===0?'M':'L') + p.x + ' ' + p.y + ' '; });
      path.setAttribute('d', d); path.setAttribute('stroke', stroke); path.setAttribute('stroke-width', sw);
      path.setAttribute('fill', 'none'); path.setAttribute('opacity', '0.8'); path.setAttribute('stroke-linecap', 'round');
      previewG.appendChild(path);
    }
  }

  svg.addEventListener('mousemove', e => {
    const m = getMouse(e);
    state.mouse = m;
    updateHud();

    if (state.isPanning) {
      const dx = (e.clientX - state.lastPan.x) / state.camera.zoom;
      const dy = (e.clientY - state.lastPan.y) / state.camera.zoom;
      state.camera.x -= dx; state.camera.y -= dy;
      state.lastPan = { x: e.clientX, y: e.clientY };
      applyCamera();
      return;
    }

    if (state.isRotating && state.selectedId) {
      const obj = getSelected();
      if (obj && state.rotCenter) {
        const angle = Math.atan2(m.wy - state.rotCenter.y, m.wx - state.rotCenter.x) * 180 / Math.PI;
        obj.rot = Math.round((angle - state.rotStartAngle) / 15) * 15;
        rebuildSVG(); updateSelFields();
      }
      return;
    }

    if (state.isDragging && state.selectedId) {
      const obj = getSelected();
      if (obj) {
        let nx = m.wx - state.dragOffset.x, ny = m.wy - state.dragOffset.y;
        if (state.snap) { nx = snap(nx); ny = snap(ny); }
        moveObjectTo(obj, nx, ny);
        rebuildSVG(); updateSelFields();
      }
      return;
    }

    if (state.isResizing && state.selectedId) {
      const obj = getSelected();
      if (!obj || obj.type === 'line' || obj.type === 'path' || obj.type === 'bezier') return;
      const b = state.startPos.bounds;
      let x = b.x, y = b.y, w = b.w, h = b.h;
      const mx = snap(m.wx), my = snap(m.wy);
      const hnd = state.resizeHandle;
      if (hnd.includes('e')) w = Math.max(4, mx - x);
      if (hnd.includes('s')) h = Math.max(4, my - y);
      if (hnd.includes('w')) { w = Math.max(4, b.x + b.w - mx); x = mx; }
      if (hnd.includes('n')) { h = Math.max(4, b.y + b.h - my); y = my; }
      obj.x = x; obj.y = y; obj.w = w; obj.h = h;
      rebuildSVG(); updateSelFields();
      return;
    }

    if (state.isDrawing || state.bezierPts.length) {
      if (state.tool === 'pencil' && state.currentPath) {
        let x = snap(m.wx), y = snap(m.wy);
        const last = state.currentPath.points[state.currentPath.points.length - 1];
        if (Math.hypot(x - last.x, y - last.y) > 3) state.currentPath.points.push({ x, y });
      }
      renderPreview();
    }
  });

  window.addEventListener('mouseup', () => {
    if (state.isPanning) { state.isPanning = false; svg.style.cursor = state.tool === 'pan' ? 'grab' : 'crosshair'; return; }
    if (state.isDragging || state.isResizing || state.isRotating) {
      state.isDragging = false; state.isResizing = false; state.isRotating = false; updateUI(); return;
    }
    if (!state.isDrawing) return;
    if (state.tool === 'bezier') return;

    const m = state.mouse;
    const x1 = state.startPos.x, y1 = state.startPos.y;
    const x2 = snap(m.wx), y2 = snap(m.wy);
    pushHistory();

    if (state.tool === 'line') {
      state.objects.push({ id: uid(), type: 'line', x1, y1, x2, y2, stroke: state.strokeColor, thickness: state.strokeWidth, rot: 0 });
    } else if (state.tool === 'rect') {
      const x = Math.min(x1,x2), y = Math.min(y1,y2), w = Math.abs(x2-x1)||state.gridSize, h = Math.abs(y2-y1)||state.gridSize;
      state.objects.push({ id: uid(), type: 'rect', x, y, w, h, stroke: state.strokeColor, fill: state.fillColor, filled: state.fillShapes, thickness: state.strokeWidth, rot: 0 });
    } else if (state.tool === 'triangle') {
      const x = Math.min(x1,x2), y = Math.min(y1,y2), w = Math.abs(x2-x1)||state.gridSize, h = Math.abs(y2-y1)||state.gridSize;
      state.objects.push({ id: uid(), type: 'triangle', x, y, w, h, stroke: state.strokeColor, fill: state.fillColor, filled: state.fillShapes, thickness: state.strokeWidth, rot: 0 });
    } else if (state.tool === 'circle') {
      const x = Math.min(x1,x2), y = Math.min(y1,y2), w = Math.abs(x2-x1)||state.gridSize, h = Math.abs(y2-y1)||state.gridSize;
      state.objects.push({ id: uid(), type: 'circle', x, y, w, h, stroke: state.strokeColor, fill: state.fillColor, filled: state.fillShapes, thickness: state.strokeWidth, rot: 0 });
    } else if (state.tool === 'pencil' && state.currentPath) {
      if (state.currentPath.points.length > 1) {
        if (state.pencilMode === 'smooth') {
          state.currentPath.points = smoothPoints(state.currentPath.points, 2);
          state.currentPath.smooth = true;
        } else {
          state.currentPath.smooth = false; // Legacy: puntos tal cual, polyline firme
        }
        state.currentPath.type = 'path';
        state.objects.push(state.currentPath);
      }
      state.currentPath = null;
    }

    state.isDrawing = false; state.startPos = null; previewG.innerHTML = '';
    rebuildSVG(); updateUI();
  });

  svg.addEventListener('dblclick', () => { if (state.tool === 'bezier' && state.bezierPts.length >= 2) finishBezier(); });
  svg.addEventListener('contextmenu', e => e.preventDefault());

  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const m = getMouse(e);
    const before = screenToWorld(m.sx, m.sy);
    const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
    state.camera.zoom = Math.min(6, Math.max(0.12, state.camera.zoom * factor));
    const after = screenToWorld(m.sx, m.sy);
    state.camera.x += before.x - after.x; state.camera.y += before.y - after.y;
    applyCamera(); drawSelection();
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.ctrlKey && e.code === 'KeyZ') { e.preventDefault(); undo(); }
    if (e.ctrlKey && e.code === 'KeyY') { e.preventDefault(); redo(); }
    if (e.code === 'Delete' || e.code === 'Backspace') {
      if (state.selectedId) {
        pushHistory();
        state.objects = state.objects.filter(o => o.id !== state.selectedId);
        state.selectedId = null; rebuildSVG(); updateUI();
      }
    }
    if (e.code === 'KeyV') setTool('select');
    if (e.code === 'KeyP') setTool('pencil');
    if (e.code === 'KeyL') setTool('line');
    if (e.code === 'KeyB') setTool('bezier');
    if (e.code === 'KeyR') setTool('rect');
    if (e.code === 'KeyT') setTool('triangle');
    if (e.code === 'KeyC') setTool('circle');
    if (e.code === 'KeyE') setTool('eraser');
    if (e.code === 'KeyH') setTool('pan');
    if (e.code === 'Escape') {
      state.selectedId = null; state.bezierPts = []; state.isDrawing = false;
      previewG.innerHTML = ''; drawSelection(); updateUI();
    }
    if (e.code === 'Enter' && state.tool === 'bezier') finishBezier();
  });

  function setTool(name) {
    state.tool = name;
    document.querySelectorAll('.tool').forEach(b => b.classList.toggle('active', b.dataset.tool === name));
    svg.style.cursor = name === 'pan' ? 'grab' : name === 'select' ? 'default' : 'crosshair';
    if (name !== 'bezier') { state.bezierPts = []; previewG.innerHTML = ''; }
  }
  document.querySelectorAll('.tool').forEach(btn => btn.addEventListener('click', () => setTool(btn.dataset.tool)));

  document.getElementById('strokeColor').addEventListener('input', e => state.strokeColor = e.target.value);
  document.getElementById('fillColor').addEventListener('input', e => state.fillColor = e.target.value);
  document.getElementById('fillShapes').addEventListener('change', e => state.fillShapes = e.target.checked);
  document.getElementById('strokeWidth').addEventListener('change', e => state.strokeWidth = +e.target.value || 2);

  function setPencilMode(mode) {
    state.pencilMode = mode;
    document.getElementById('modeLegacy').classList.toggle('active', mode === 'legacy');
    document.getElementById('modeSmooth').classList.toggle('active', mode === 'smooth');
  }
  document.getElementById('modeLegacy').addEventListener('click', () => setPencilMode('legacy'));
  document.getElementById('modeSmooth').addEventListener('click', () => setPencilMode('smooth'));
  document.getElementById('gridSize').addEventListener('change', e => { state.gridSize = +e.target.value || 32; updateGrid(); });
  document.getElementById('showGrid').addEventListener('change', e => { state.showGrid = e.target.checked; updateGrid(); });
  document.getElementById('snapGrid').addEventListener('change', e => state.snap = e.target.checked);

  document.getElementById('btnUndo').addEventListener('click', undo);
  document.getElementById('btnRedo').addEventListener('click', redo);
  document.getElementById('btnZoomIn').addEventListener('click', () => { state.camera.zoom = Math.min(6, state.camera.zoom * 1.25); applyCamera(); drawSelection(); });
  document.getElementById('btnZoomOut').addEventListener('click', () => { state.camera.zoom = Math.max(0.12, state.camera.zoom / 1.25); applyCamera(); drawSelection(); });
  document.getElementById('btnFit').addEventListener('click', () => { state.camera = { x: 0, y: 0, zoom: 1 }; applyCamera(); drawSelection(); });

  document.getElementById('btnNew').addEventListener('click', () => {
    if (state.objects.length && !confirm('¿Nuevo dibujo?')) return;
    state.objects = []; state.selectedId = null; state.history = []; state.historyIndex = -1;
    pushHistory(); rebuildSVG(); updateUI();
  });
  document.getElementById('btnClear').addEventListener('click', () => {
    if (!confirm('¿Limpiar todo?')) return;
    pushHistory(); state.objects = []; state.selectedId = null; rebuildSVG(); updateUI();
  });

  function updateSelFields() {
    const o = getSelected();
    if (!o) { ['selX','selY','selW','selH','selRot'].forEach(id => document.getElementById(id).value = 0); return; }
    const b = getBounds(o);
    document.getElementById('selX').value = Math.round(b.x);
    document.getElementById('selY').value = Math.round(b.y);
    document.getElementById('selW').value = Math.round(b.w);
    document.getElementById('selH').value = Math.round(b.h);
    document.getElementById('selRot').value = o.rot || 0;
  }

  document.getElementById('btnApply').addEventListener('click', () => {
    const o = getSelected(); if (!o) return;
    pushHistory();
    const nx = +document.getElementById('selX').value, ny = +document.getElementById('selY').value;
    const nw = +document.getElementById('selW').value, nh = +document.getElementById('selH').value;
    const nr = +document.getElementById('selRot').value;
    moveObjectTo(o, nx, ny);
    if (o.type !== 'line' && o.type !== 'path' && o.type !== 'bezier') { o.w = Math.max(1, nw); o.h = Math.max(1, nh); }
    o.rot = nr;
    rebuildSVG();
  });

  document.getElementById('btnDuplicate').addEventListener('click', () => {
    const o = getSelected(); if (!o) return;
    pushHistory();
    const copy = JSON.parse(JSON.stringify(o));
    copy.id = uid();
    moveObjectTo(copy, getBounds(copy).x + state.gridSize, getBounds(copy).y + state.gridSize);
    state.objects.push(copy); state.selectedId = copy.id;
    rebuildSVG(); updateUI();
  });

  document.getElementById('btnDeleteSel').addEventListener('click', () => {
    if (!state.selectedId) return;
    pushHistory();
    state.objects = state.objects.filter(o => o.id !== state.selectedId);
    state.selectedId = null; rebuildSVG(); updateUI();
  });

  function updateObjList() {
    const list = document.getElementById('objList');
    list.innerHTML = '';
    document.getElementById('objCount').textContent = '(' + state.objects.length + ')';
    state.objects.forEach(o => {
      const item = document.createElement('div');
      item.className = 'obj-item' + (o.id === state.selectedId ? ' selected' : '');
      const dot = document.createElement('div');
      dot.className = 'dot'; dot.style.background = o.stroke || '#5b8def';
      item.appendChild(dot);
      item.appendChild(document.createTextNode(o.type + ' · ' + o.id));
      item.onclick = () => { state.selectedId = o.id; drawSelection(); updateUI(); };
      list.appendChild(item);
    });
  }
  function updateUI() { updateSelFields(); updateObjList(); }

  document.getElementById('btnSave').addEventListener('click', () => {
    const name = document.getElementById('projectName').value.trim() || 'untitled';
    const data = { format: 'lgd', version: 3.0, name, created: new Date().toISOString(), gridSize: state.gridSize, objects: state.objects, camera: state.camera };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '.lgd'; a.click();
  });

  document.getElementById('btnOpen').addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        state.objects = data.objects || [];
        state.gridSize = data.gridSize || 32;
        state.camera = data.camera || { x: 0, y: 0, zoom: 1 };
        state.selectedId = null;
        document.getElementById('projectName').value = data.name || 'mi_dibujo';
        document.getElementById('gridSize').value = state.gridSize;
        state.history = []; state.historyIndex = -1; pushHistory();
        updateGrid(); applyCamera(); rebuildSVG(); updateUI();
      } catch (err) { alert('Error: ' + err.message); }
    };
    reader.readAsText(file); e.target.value = '';
  });

  document.getElementById('btnExport').addEventListener('click', () => {
    const clone = svg.cloneNode(true);
    clone.setAttribute('width', svg.clientWidth); clone.setAttribute('height', svg.clientHeight);
    const data = new XMLSerializer().serializeToString(clone);
    const blob = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = svg.clientWidth; c.height = svg.clientHeight;
      const cx = c.getContext('2d');
      cx.fillStyle = '#08080c'; cx.fillRect(0, 0, c.width, c.height);
      cx.drawImage(img, 0, 0);
      const a = document.createElement('a');
      a.download = (document.getElementById('projectName').value || 'export') + '.png';
      a.href = c.toDataURL('image/png'); a.click();
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });

  updateGrid(); applyCamera(); pushHistory(); rebuildSVG(); updateUI();
  </script>
</body>
</html>
